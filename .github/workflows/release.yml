name: Release image

# Pushing a tag like v1.2.0 publishes multi-arch images (linux/amd64 + linux/arm64) to
#   docker.io/runsnip/compress-media        :1.2.0 :1.2 :1 :latest
#                                           :1.2.0-nopdf :1.2-nopdf :1-nopdf :latest-nopdf  (no Ghostscript/AGPL)
#   ghcr.io/material-atomic/compress-media  (same tags)
# and syncs DOCKERHUB.md to the Docker Hub page.
#
# Repository secrets needed:
#   DOCKERHUB_USERNAME  Docker Hub user with push access to the "runsnip" namespace
#   DOCKERHUB_TOKEN     Docker Hub access token with Read, Write, Delete scope
#                       (Delete is only needed for the description sync)

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: runsnip/compress-media

jobs:
  # The full test suite on the tagged commit; nothing is published unless it passes.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "Tag $GITHUB_REF_NAME != $expected"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          # metadata-action would label the image with just the repo's license (MIT); the image also
          # contains GPL/AGPL/LGPL/MPL binaries (see THIRD_PARTY_NOTICES.md).
          labels: |
            org.opencontainers.image.licenses=MIT AND GPL-2.0-or-later AND LGPL-3.0-or-later AND AGPL-3.0-or-later AND Apache-2.0 AND MPL-2.0 AND Bitstream-Vera

      # Same tags with a -nopdf suffix: the image without Ghostscript (AGPL-3.0) and PDF support.
      - id: meta-nopdf
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-nopdf,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=MIT AND GPL-2.0-or-later AND LGPL-3.0-or-later AND Apache-2.0 AND MPL-2.0 AND Bitstream-Vera

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GHOSTSCRIPT=false
          tags: ${{ steps.meta-nopdf.outputs.tags }}
          labels: ${{ steps.meta-nopdf.outputs.labels }}
          cache-from: type=gha

      - name: Smoke test the published images
        run: |
          V=${GITHUB_REF_NAME#v}
          docker run --rm "${{ env.DOCKERHUB_IMAGE }}:$V" compress-media --version
          docker run --rm "${{ env.DOCKERHUB_IMAGE }}:$V" compress-media info | grep 'PDF compression:   yes'
          docker run --rm "${{ env.DOCKERHUB_IMAGE }}:$V" compress-media info | grep 'Subtitles:         yes (whisper-cli), burn-in'
          docker run --rm "${{ env.DOCKERHUB_IMAGE }}:$V-nopdf" compress-media info | grep 'Subtitles:         yes'
          docker run --rm "${{ env.DOCKERHUB_IMAGE }}:$V-nopdf" compress-media info | grep 'PDF compression:   no'
          docker run --rm --entrypoint sh "${{ env.DOCKERHUB_IMAGE }}:$V-nopdf" -c '! command -v gs'
          docker run -d --name app -p 4747:4747 "${{ env.DOCKERHUB_IMAGE }}:$V"
          timeout 30 sh -c 'until curl -sf localhost:4747/api/health; do sleep 1; done'

      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: Self-hosted video, image, audio & PDF compressor, GIF maker and subtitles — web UI, API, CLI
          readme-filepath: ./DOCKERHUB.md
