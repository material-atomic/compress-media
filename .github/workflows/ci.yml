name: CI

# Two levels, so everyday pushes stay quick:
#   light  push to main — Node 22 on Linux and Windows, E2E in Chromium (~3 min)
#   full   pull requests, release tags (called by release.yml before publishing) and manual runs —
#          Node 20 + 22 on Linux, macOS and Windows, E2E in 3 browsers, S3, Redis and the Docker image
# Changes that only touch documentation don't run CI.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'llms.txt', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'llms.txt', 'LICENSE']
  workflow_dispatch:
    inputs:
      full:
        description: Run everything (all platforms, browsers, S3, Redis, Docker)
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || inputs.full) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        node: ${{ fromJSON((github.event_name == 'pull_request' || inputs.full) && '[20,22]' || '[22]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Ghostscript for the PDF tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: npm run typecheck
      - run: node --check server.js
      - run: node --check lib/media.js
      - run: node --check bin/cli.js
      - run: node --check public/app.js
      - run: node --check public/i18n.js
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ghostscript
      - name: E2E in Chromium, Firefox and WebKit (full) or Chromium only (light)
        env:
          FULL: ${{ github.event_name == 'pull_request' || inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            npx playwright install --with-deps chromium firefox webkit && npm run test:e2e
          else
            npx playwright install --with-deps chromium && npx playwright test --project=chromium
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  s3:
    name: Object storage (S3 via SeaweedFS)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || inputs.full
    env:
      STORAGE: s3
      S3_BUCKET: compress-media
      S3_ENDPOINT: http://127.0.0.1:9100
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: testkey
      S3_SECRET_ACCESS_KEY: testsecret
      S3_SETUP_CORS: 'true'
      UPLOAD_PART_MB: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start SeaweedFS (S3 API) and create the bucket
        run: |
          mkdir -p /tmp/s3conf
          echo '{"identities":[{"name":"t","credentials":[{"accessKey":"testkey","secretKey":"testsecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3conf/s3.json
          docker run -d --name s3 -p 9100:8333 -v /tmp/s3conf:/etc/cms chrislusf/seaweedfs:3.97 server -s3 -s3.config=/etc/cms/s3.json -dir=/data -master.volumeSizeLimitMB=256 -volume.max=100
          node -e "
            const { S3Client, CreateBucketCommand } = require('@aws-sdk/client-s3');
            const s3 = new S3Client({ region: 'us-east-1', endpoint: process.env.S3_ENDPOINT, forcePathStyle: true, credentials: { accessKeyId: 'testkey', secretAccessKey: 'testsecret' } });
            (async () => { for (let i = 0; i < 60; i++) { try { await s3.send(new CreateBucketCommand({ Bucket: 'compress-media' })); return; } catch (e) { if (/Exists|Owned/.test(e.name)) return; await new Promise(r => setTimeout(r, 1000)); } } process.exit(1); })();"
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: E2E with browsers uploading straight to the bucket
        run: PUBLIC_URL=http://127.0.0.1:4790 npx playwright test --project=chromium --workers=1
      - if: failure()
        run: docker logs s3 | tail -50

  redis:
    name: Shared queue (Redis, separate web and workers)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || inputs.full
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      QUEUE: redis
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API, CLI and auth tests with the Redis queue (all-in-one process)
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: E2E through one web server and two workers
        run: |
          export AUTH_USERNAME=e2e@example.com AUTH_PASSWORD=e2e-password WORK_DIR=/tmp/cm-work
          ROLE=web PORT=4790 node server.js > web.log 2>&1 &
          node bin/cli.js worker > worker1.log 2>&1 &
          ROLE=worker node server.js > worker2.log 2>&1 &
          timeout 30 sh -c 'until curl -sf localhost:4790/api/health; do sleep 1; done'
          E2E_BASE_URL=http://127.0.0.1:4790 npx playwright test --project=chromium
      - if: failure()
        run: tail -50 web.log worker1.log worker2.log

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || inputs.full
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: compress-media:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test inside the container
        run: docker run --rm -v "$PWD/test:/app/test:ro" -e HOST=127.0.0.1 compress-media:ci node --test test/smoke.test.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A spoken test video (e2e/global-setup.js), so the image's whisper.cpp is exercised for real.
      - run: sudo apt-get install -y --no-install-recommends espeak-ng
      - name: E2E against the container
        run: |
          docker run -d --name app -p 4790:4747 -e MEDIA_CONCURRENCY=3 \
            -e AUTH_USERNAME=e2e@example.com -e AUTH_PASSWORD=e2e-password compress-media:ci
          timeout 30 sh -c 'until curl -sf localhost:4790/api/health; do sleep 1; done'
          E2E_BASE_URL=http://127.0.0.1:4790 npx playwright test --project=chromium
      - if: failure()
        run: docker logs app
