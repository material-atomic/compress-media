services:
  compress-media:
    image: ${COMPRESS_MEDIA_IMAGE:-runsnip/compress-media:latest}
    restart: unless-stopped
    ports:
      # Only reachable from this machine. Use "4747:4747" to expose it on your network.
      - "127.0.0.1:${COMPRESS_MEDIA_PORT:-4747}:4747"
    environment:
      # Login (on by default). Without AUTH_PASSWORD one is generated: `docker compose logs | grep Login`.
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      # Hours to keep uploaded and compressed files before they are deleted.
      JOB_TTL_HOURS: ${JOB_TTL_HOURS:-3}
      # Per-file upload limit in MB (0 = unlimited).
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-0}
      # How many video/audio jobs run in parallel (each ffmpeg already uses all cores).
      MEDIA_CONCURRENCY: ${MEDIA_CONCURRENCY:-1}
      UPLOAD_PART_MB: ${UPLOAD_PART_MB:-8}
      UPLOAD_CONCURRENCY: ${UPLOAD_CONCURRENCY:-4}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Object storage (see README → Object storage). Leave STORAGE=local to keep files on /data.
      STORAGE: ${STORAGE:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-compress-media/}
      S3_SETUP_CORS: ${S3_SETUP_CORS:-false}
    volumes:
      # Scratch space for uploads and results — make sure it has room for your largest videos.
      - media-data:/data

volumes:
  media-data:
